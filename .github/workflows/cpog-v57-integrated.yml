name: CPOG v57 Integrated Paper Claims Verification

on:
  push:
    branches:
      - cpog-v57-paperclaims-integration
    paths:
      - 'CPOG/**'
      - 'CPOG.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'cpog_verify/**'
      - '.github/workflows/cpog-v57-integrated.yml'
  workflow_dispatch:

concurrency:
  group: cpog-v57-paperclaims-integration
  cancel-in-progress: true

jobs:
  paper-package:
    name: Paper-level modular package
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify committed Lake manifest
        run: test -f lake-manifest.json

      - name: Install Lean from root toolchain
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          TOOLCHAIN="$(cat lean-toolchain)"
          "$HOME/.elan/bin/elan" toolchain install "$TOOLCHAIN"
          "$HOME/.elan/bin/elan" default "$TOOLCHAIN"

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Reject proof holes and explicit axioms
        run: |
          ! grep -RInE '^[[:space:]]*(sorry|admit)([[:space:]]|$)|^[[:space:]]*unsafe[[:space:]]|^[[:space:]]*axiom[[:space:]]' CPOG CPOG.lean

      - name: Full root build
        run: lake build

      - name: Kernel checker and axiom audit
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: "CPOG"
          axiom-audit: true
          axiom-audit-root: "CPOG"

  generic-package:
    name: v56 generic invariance package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpog_verify
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble exact source
        run: |
          cat parts/part*.lean > CPOG.lean
          test -s CPOG.lean
          ! grep -nE '\b(sorry|admit|unsafe)\b|^[[:space:]]*axiom[[:space:]]' CPOG.lean

      - name: Build and kernel-check
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: cpog_verify
          build: true
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: "CPOG"
          axiom-audit: true
          axiom-audit-root: "CPOG"
          use-github-cache: false

      - name: Upload exact checked source
        uses: actions/upload-artifact@v4
        with:
          name: CPOG-v57-generic-exact-source
          path: cpog_verify/CPOG.lean
          if-no-files-found: error

  integrated-gate:
    name: Integrated formal gate
    runs-on: ubuntu-latest
    needs:
      - paper-package
      - generic-package
    steps:
      - run: |
          echo "paper-level modular package: PASS"
          echo "generic invariance package: PASS"
          echo "CPOG v57 integrated gate: PASS"
