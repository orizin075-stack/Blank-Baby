# OROR War x Nightfall (NeoForge 1.21.1): rebuild the patched OROR Reborn classes against the real NeoForge and the
# pack's own mod jars, and make the next jar from the shipped one (oror_rework/neoforge1211patch). A good build commits
# the jar and its report to oror_rework/neoforge1211patch/out on this branch; a failed one commits the report.
name: OROR NeoForge 1.21.1 patch build

on:
  push:
    branches: [claude/jolly-einstein-wvpjq1]
    paths: ['oror_rework/neoforge1211patch/**', '.github/workflows/oror1211.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oror1211-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
        working-directory: oror_rework/neoforge1211patch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Gradle 8.14.3 fetched here, from Gradle's own address and checked against its published checksum, with
      # patient retries: its download (GitHub's release files behind services.gradle.org) answered 504 for a
      # while, and setup-gradle gives up after two tries. setup-gradle then only keeps the caches.
      - name: Gradle 8.14.3
        run: |
          d=https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          curl -fsSL --retry 40 --retry-all-errors --retry-delay 15 --retry-max-time 1200 -o "$RUNNER_TEMP/gradle.zip" "$d"
          sum=$(curl -fsSL --retry 40 --retry-all-errors --retry-delay 15 --retry-max-time 600 "$d.sha256")
          echo "$sum  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle-dist"
          echo "$RUNNER_TEMP/gradle-dist/gradle-8.14.3/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch the pack's mod jars
        run: |
          mkdir -p out
          python3 -I tools/cf_fetch.py pack/manifest-0.17.23.json pack/lock-0.17.23.json libs \
            epic-fight-21.17.3.1-mc1.21.1-neoforge.jar irons_spellbooks-1.21.1-3.16.3.jar irons_lib-1.21.1-2.2.0.jar \
            geckolib-neoforge-1.21.1-4.9.3.jar player-animation-lib-forge-2.0.4+1.21.1.jar curios-neoforge-9.5.1+1.21.1.jar \
            dodge_parry_reward-1.21.1-1.0.0.jar superbwarfare-0.8.9.2-mc1.21.1-c22d98c2.jar kotlinforforge-5.12.0-all.jar \
            2>&1 | tee out/report.txt
          # where GeckoLib keeps the classes the OROR guns' renderer and model use (its packages moved in 4.5)
          unzip -l libs/geckolib-neoforge-1.21.1-4.9.3.jar | grep -E '/(GeoBone|AnimationState|GeoAnimatable|GeoItem|GeoItemRenderer|GeoModel)\.class' \
            | awk '{print $4}' | tee -a out/report.txt
          # Nightfall (SETUP_NIGHTFALL.cmd's download) and the original Indestructible fork the 0.17.24 native-combat jar
          # builds on (its compatibility build differs only in client config registration).
          curl -sSfL -o libs/nightfall.jar "$(python3 -I -c 'import json;print(json.load(open("pack/install-0.17.23.json"))["nightfall"]["url"])')"
          curl -sSfL -o "$RUNNER_TEMP/indestructible.jar" https://mediafilez.forgecdn.net/files/7932/288/indestructible-21.16.3-1.21.1.jar
          cp "$RUNNER_TEMP/indestructible.jar" libs/
          sha256sum libs/nightfall.jar "$RUNNER_TEMP/indestructible.jar" | tee -a out/report.txt
      - name: Nightfall's names of the weapons the alias weapons copy
        run: |
          python3 -I - libs/nightfall.jar <<'PY' 2>&1 | tee -a out/report.txt
          import json, re, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          wanted = re.compile(r'item\.efn\.(exsiliumgladius|fire_exsiliumgladius|meen_spear|crimson_moon|air_tachi|arc_tachi|nf_shortsword|nf_shortsword_2|crescent_moon|excalibur|flag_bearer)(_e)?$')
          for lang in ('en_us', 'ja_jp', 'zh_cn'):
              name = f'assets/efn/lang/{lang}.json'
              table = json.loads(z.read(name).decode('utf-8')) if name in z.namelist() else {}
              print('==', name, len(table))
              for key in sorted(table):
                  if wanted.match(key) or 'flag' in key or 'excalibur' in key:
                      print(' ', key, '=', json.dumps(table[key], ensure_ascii=False))
          PY
      - name: Compile against NeoForge 1.21.1
        run: |
          gradle compileJava --console=plain 2>&1 | tee -a out/report.txt
      - name: Check mixin targets and mod ids in the real jars
        run: |
          {
            set +e  # a check that finds nothing is reported, not fatal
            echo '== ComboAttacks.executeOnServer (Epic Fight)'
            javap -p -cp libs/epic-fight-21.17.3.1-mc1.21.1-neoforge.jar yesman.epicfight.skill.common.ComboAttacks | grep executeOnServer
            echo '== AbstractSpell.canBeCastedBy (Iron'"'"'s Spells)'
            javap -p -cp libs/irons_spellbooks-1.21.1-3.16.3.jar io.redspace.ironsspellbooks.api.spells.AbstractSpell | grep canBeCastedBy
            BASE=base/oror_supreme_bosses-$(sed -n 's/^base_version=//p' gradle.properties).jar
            echo "== AdaptiveCombat.tick ($BASE)"
            javap -p -cp $BASE jp.oror.reborn.AdaptiveCombat | grep ' tick('
            echo '== Nightfall and Indestructible mod ids'
            unzip -p libs/nightfall.jar META-INF/neoforge.mods.toml | grep -m3 -E '^\s*modId'
            unzip -p "$RUNNER_TEMP/indestructible.jar" META-INF/neoforge.mods.toml | grep -m3 -E '^\s*modId'
            echo '== EFNSkills / DPRSkills fields'
            javap -p -cp libs/nightfall.jar com.hm.efn.gameasset.EFNSkills | grep -E 'EFN_PARRY|EFN_DODGE_ROLL|EFN_DODGE_STEP'
            javap -p -cp libs/dodge_parry_reward-1.21.1-1.0.0.jar com.p1nero.dpr.gameassets.DPRSkills | grep STAMINA1
            echo '== Indestructible AdvancedCustomHumanoidMobPatch: isBlocking/setParry inside preTickServer (NightfallEnemyRecoveryMixin redirects every isBlocking call there)'
            javap -c -p -cp "$RUNNER_TEMP/indestructible.jar" com.nameless.indestructible.world.capability.AdvancedCustomHumanoidMobPatch \
              | awk '/ preTickServer\(\);/{on=1} on&&/^  [a-z].*\(.*\);$/&&!/preTickServer/{on=0} on' | grep -n -E 'isBlocking|setParry|Stamina|getStaminaRegen|regen' | head -40
            echo '== who calls setParry(true) (NightfallEnemyParryWindowMixin times the window from the last call)'
            mkdir -p "$RUNNER_TEMP/ind" && unzip -q -o "$RUNNER_TEMP/indestructible.jar" 'com/*' -d "$RUNNER_TEMP/ind"
            for c in $(cd "$RUNNER_TEMP/ind" && grep -rl --include='*.class' setParry com | sed 's/\.class$//;s#/#.#g'); do
              echo "-- $c"; javap -c -p -cp "$RUNNER_TEMP/ind" "$c" | grep -B3 'setParry' | grep -E 'iconst|setParry|Method .*\(' | head -12
            done
            echo '== Superb Warfare charging station (the OROR guns hold 1,000,000 and 600,000 FE)'
            javap -constants -p -cp libs/superbwarfare-0.8.9.2-mc1.21.1-c22d98c2.jar \
              com.atsuishio.superbwarfare.block.entity.ChargingStationBlockEntity | grep -E 'static final int'
            echo '== Superb Warfare VehicleEntity.move (059d TurretRestMixin: still turrets skip most moves)'
            javap -p -cp libs/superbwarfare-0.8.9.2-mc1.21.1-c22d98c2.jar \
              com.atsuishio.superbwarfare.entity.vehicle.base.VehicleEntity | grep -E ' move\(|vMove|vCollide'
            echo '== EpicFightCapabilities.getEntityPatch (null entity?)'
            javap -c -p -cp libs/epic-fight-21.17.3.1-mc1.21.1-neoforge.jar yesman.epicfight.world.capabilities.EpicFightCapabilities \
              | awk '/getEntityPatch\(net.minecraft.world.entity.Entity, java.lang.Class\)/{on=1} on{print; if(++n>14) exit}'
          } 2>&1 | tee -a out/report.txt
      - name: Mixin targets in Minecraft (Grand Citadel)
        run: |
          {
            set +e
            for j in $(find build ~/.gradle/caches -name 'neoforge-*.jar' 2>/dev/null | grep -v -E 'sources|installer|userdev|universal' | head -20); do
              if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/world/level/chunk/ChunkGenerator.class'; then
                echo "== $j"; javap -p -cp "$j" net.minecraft.world.level.chunk.ChunkGenerator | grep -E 'createStructures|tryGenerateStructure'
                # (058) what SafeEntityUnloadMixin redirects: the call in processUnloads, and updateChunkStatus
                javap -p -c -cp "$j" net.minecraft.world.level.entity.PersistentEntitySectionManager | grep -E 'processUnloads|updateChunkStatus|removeIf' | head -12
                # (059d) what TreasureMapCacheMixin redirects: the structure search in a cartographer's map offer
                javap -p -c -cp "$j" 'net.minecraft.world.entity.npc.VillagerTrades$TreasureMapForEmeralds' | grep -E 'getOffer|findNearestMapStructure' | head -6
                break
              fi
            done
          } 2>&1 | tee -a out/report.txt
      - name: Iron's Spells 'n Spellbooks, for the royals' casting animations (051)
        run: |
          {
            set +e
            ISS=$(ls libs/irons_spellbooks-*.jar | head -n 1)
            python3 -I tools/iss_probe.py "$ISS"
            for c in AbstractSpellCastingMobRenderer AbstractSpellCastingMobModel AbstractSpellCastingMob; do
              javap -p -cp "$ISS" io.redspace.ironsspellbooks.entity.mobs.abstract_spell_casting_mob.$c
            done
            unzip -l "$ISS" | grep -E 'abstract_spell_casting_mob/|render/.*(Layer|Geo)' | awk '{print $4}' | head -n 60
            G=$(ls libs/geckolib-*.jar | head -n 1)
            javap -p -cp "$G" software.bernie.geckolib.renderer.GeoEntityRenderer | head -n 60
            javap -p -cp "$G" software.bernie.geckolib.model.GeoModel | head -n 40
          } > out/iss_probe.txt 2>&1 || true
          wc -l out/iss_probe.txt
      - name: Make the release jar
        run: |
          BASE=$(sed -n 's/^base_version=//p' gradle.properties); NEW=$(sed -n 's/^release_version=//p' gradle.properties)
          python3 -I tools/patch_jar.py base/oror_supreme_bosses-$BASE.jar build/classes/java/main lang \
            out/oror_supreme_bosses-$NEW.jar $BASE $NEW overlay 2>&1 | tee -a out/report.txt
          sha256sum out/oror_supreme_bosses-$NEW.jar | tee -a out/report.txt
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pack053
          key: pack053-${{ hashFiles('oror_rework/neoforge1211patch/pack/manifest-053.json') }}
      - name: The 053 pack's mods for the dedicated server (045's and six of the user's 学びパック)
        run: |
          # as the 045 tests did: the whole pack but the client-only Sodium, FancyToasts, ChatPlus and ExtraSounds
          python3 -I tools/fetch_pack.py pack/manifest-053.json "$RUNNER_TEMP/pack053" sodium fancytoasts chatplus extrasounds \
            > out/pack_fetch.txt 2>&1 || true
          tail -3 out/pack_fetch.txt
          ls "$RUNNER_TEMP/pack053" | grep -i -E 'indestructible|falchion|nightfall|efn' || true
          # Alex's Caves' per-entity magnetism and seed holder (a tenth of the battle's server thread by the profile)
          AC=$(ls "$RUNNER_TEMP"/pack053/*.jar | grep -i alexscaves | head -n 1)
          { echo "== $AC"; javap -p -cp "$AC" com.github.alexmodguy.alexscaves.server.entity.util.MagnetUtil | grep -E 'static'
            javap -p -cp "$AC" com.github.alexmodguy.alexscaves.server.level.biome.ACWorldSeedHolder | grep -E 'setDimension|static'
            unzip -l "$AC" | grep -i -E 'mixin.*(Entity|Level)' | head -n 20; } >> out/report.txt 2>&1 || true
          # (053) what its magnet search reads, and which entities its magnetism moves (for the magnet cache)
          { for m in tickMagnetism getNearbyAttractingMagnets getNearbyRepellingMagnets isPulledByMagnets attachesToMagnets; do
              echo "== MagnetUtil.$m"; javap -c -p -cp "$AC" com.github.alexmodguy.alexscaves.server.entity.util.MagnetUtil \
                | awk -v m="$m" 'index($0, " " m "(") && /static/ {on=1} on {print} on && /^$/ {on=0}' | head -n 160
            done
            echo "== ACWorldSeedHolder"; javap -c -p -cp "$AC" com.github.alexmodguy.alexscaves.server.level.biome.ACWorldSeedHolder | head -n 120
          } > out/ac_magnet_bytecode.txt 2>&1 || true
      - name: Dedicated server - Grand Citadel with its court and garrison, the hundred-man battle, tanks and aircraft
        run: |
          set +e
          NEW=$(sed -n 's/^release_version=//p' gradle.properties)
          # Nightfall from SETUP_NIGHTFALL's download; not the original Indestructible, which loads a client class on a
          # dedicated server (the pack ships its fixed build in overrides; OROR's mixins for it skip themselves without it)
          extra=(libs/nightfall.jar)
          bash tools/server_test.sh "$RUNNER_TEMP/server" 21.1.262 20261030 5400 'CITADEL-SELFTEST {' 'CITADEL-SELFTEST-LATER' 'WAR-RESULT' \
            'FLIGHT-RESULT' 'LANDING-RESULT' 'VILLAGE-FLIGHT {' 'CITADEL-UPDATE {' 'AA-RESULT' 'KINGSLAYER-TEST' 'GUARD-RESULT' 'WORN-RESULT' 'SPELL-SWEEP-RESULT' 'MOBS-TRACE {' 'GUN-PARRY {' 'KING-STORY {' 'WAZA-RESULT' 'ROYAL-WAZA-RESULT' 'RELIC-RESULT' 'CAPITAL-LOAD {' 'SWEEP-RESULT' 'GAMETEST-RESULT' 'OWNERLESS-SWORD-TEST' 'CREW-RESULT' 'RAID-RESULT' 'CI-DONE' -- arms,guards,worn,spells,mobs,gunmobs,story,citadel,citadelupdate,capitalload,war,pilots,landings,aa,crew,villageflight,sweep,gametests,waza,royalwaza,relics,swords,raid -- out/oror_supreme_bosses-$NEW.jar "${extra[@]}" "$RUNNER_TEMP"/pack053/*.jar \
            2>&1 | tee out/server_test.txt; rc=${PIPESTATUS[0]}
          # the results first (the full list below is cut at 400 lines), then everything
          grep -E 'GAMETEST-RESULT|RELIC-RESULT|SWEEP-RESULT|SWEEP-KIT|KINGSLAYER-TEST|GUARD-|WORN-|SPELL-SWEEP-RESULT|MOBS-TRACE|GUN-CENSUS|GUN-MOBS|GUN-PARRY|KING-STORY|WAZA-RESULT|KING-FORM|KING-ENEMY|KING-GRACE|REBEL-|SUMMON|CAPITAL-LOAD|CAPITAL-INTEGRITY|CRASHNET|OROR-TRADE-DROPPED|CITADEL-SELFTEST|CITADEL-SUPPLY|CITADEL-UPDATE|WAR-RESULT|FLIGHT-RESULT|SUPPLY-TEST|LANDING-TRIAL|LANDING-RESULT|AA-RESULT|VILLAGE-FLIGHT \{|SAFE-UNLOAD|SHORT36-RESULT|GARRISON-|CITADEL-TRACE|CITADEL-READY|SANE-MOVE|OWNERLESS-SWORD|CREW-RESULT|RAID-RESULT|RAID-TABLE|CI-DONE' "$RUNNER_TEMP/server/console.log" \
            | cut -c1-6000 >> out/server_test.txt || true
          { grep -E 'CITADEL-SELFTEST|CITADEL-UPDATE|WAR-|FLIGHT-|SUPPLY-|VILLAGE-FLIGHT|PLANE-TRACK|CI-DONE|OROR (Citadel|War|Vehicles|CI|Village)|Exception|ERROR|WARN.*([Cc]itadel|[Rr]oyal|[Ww]ar)|Missing|requires' "$RUNNER_TEMP/server/console.log" | head -400; } >> out/server_test.txt
          tail -n 4000 "$RUNNER_TEMP/server/console.log" > out/server_console.log
          # every error and exception of the whole run (the tail above starts late), the first 600 lines
          grep -aE 'ERROR|Exception|Caused by|Failed to|Couldn.t|Unable to' "$RUNNER_TEMP/server/console.log" | grep -v 'HttpConnectTimeout\|ConnectException' | head -600 > out/server_errors.txt || true
          # every line of the pilots' flights (the console's tail keeps only the end of the run)
          grep -E 'PLANE-TRACK|PLANE-HURT|HELI-TRACK|VEHICLE-|SUPPLY-|FLIGHT-|LANDING-|AA-' "$RUNNER_TEMP/server/console.log" > out/flight_log.txt || true
          # every entity and item of OROR's own put to work (/oror sweep)
          grep -E 'SWEEP-|GUARD-|WORN-|STARTER-KIT|GAMETEST|[Gg]ame[Tt]est|test.*(passed|failed)' "$RUNNER_TEMP/server/console.log" > out/sweep_log.txt || true
          # where the server thread spent the battle (JFR samples between the war's start and its result)
          J="$RUNNER_TEMP/server/war.jfr"; [ -s "$J" ] || J="$RUNNER_TEMP/server/rec.jfr"
          timeout 600 python3 -I tools/jfr_hot.py "$J" "$RUNNER_TEMP/server/console.log" > out/war_profile.txt 2>&1 || true
          # (053) the capital in ordinary play (CAPITAL-LOAD), from the whole run's recording
          timeout 600 python3 -I tools/jfr_hot.py "$RUNNER_TEMP/server/rec.jfr" "$RUNNER_TEMP/server/console.log" 'CAPITAL-LOAD-START' 'CAPITAL-LOAD {' \
            > out/capital_profile.txt 2>&1 || true
          # (053) every spell the royals had, cast in turn: the sweep's lines and the errors between them
          awk '/SPELL-SWEEP-START/{on=1} on{print} /SPELL-SWEEP-RESULT/{on=0}' "$RUNNER_TEMP/server/console.log" > out/spell_log.txt || true
          # (053) every thread's stack if the server hung (tools/server_test.sh: nothing logged for three minutes)
          rm -f out/threads_stall.txt; cp "$RUNNER_TEMP/server/threads_stall.txt" out/threads_stall.txt 2>/dev/null || true
          # (053) the mobs with guns, uncut (GunMobTest: the census, the lanes, the duels)
          grep -E 'GUN-(CENSUS|MOBS|PARRY)' "$RUNNER_TEMP/server/console.log" > out/gun_mobs.txt || true
          # (054) the villager king's story, uncut (KingStoryTest and what it set off)
          grep -E 'KING-|REBEL-|SUMMON|OROR Story|OROR King|OROR Rebels|OROR Summoning' "$RUNNER_TEMP/server/console.log" > out/king_story.txt || true
          # (057) the 984 techniques, one line each (WazaTest), and their errors
          grep -E 'WAZA-|SHORT36-|OROR Waza' "$RUNNER_TEMP/server/console.log" > out/waza_log.txt || true
          # (058) the 164 relics of the V9 design: the 123 techniques, the focuses, charms and legends, one line each
          grep -E 'RELIC-|OROR Relics|relic art:' "$RUNNER_TEMP/server/console.log" > out/relic_log.txt || true
          # (059e) the 41 gods' raid kill times (RaidTest), one line per fight, and the raids' own messages
          grep -E 'RAID-|OROR Raid' "$RUNNER_TEMP/server/console.log" > out/raid_log.txt || true
          # (053) the capital as generated against its save, uncut (CitadelIntegrity)
          grep -E 'CAPITAL-INTEGRITY' "$RUNNER_TEMP/server/console.log" | sed 's/},/},\n/g' > out/capital_integrity.txt || true
          cat "$RUNNER_TEMP/server/jfr_dump.txt" >> out/war_profile.txt 2>/dev/null || true
          exit $rc
      - name: Commit the result
        if: always()
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f oror_rework/neoforge1211patch/out
          git commit -m "OROR 1.21.1 patch build ${GITHUB_SHA::7}: ${{ job.status }} [skip ci]" || exit 0
          # another run's result landed first (a cancelled run's, say): this run's out/ wins (in a rebase "theirs" is
          # the commit being replayed); the result was lost to such a conflict once
          if ! git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"; then
            git checkout --theirs -- oror_rework/neoforge1211patch/out && git add -f oror_rework/neoforge1211patch/out
            GIT_EDITOR=true git rebase --continue
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
