# OROR War x Nightfall (NeoForge 1.21.1): rebuild the patched OROR Reborn classes against the real NeoForge and the
# pack's own mod jars, and make the next jar from the shipped one (oror_rework/neoforge1211patch). A good build commits
# the jar and its report to oror_rework/neoforge1211patch/out on this branch; a failed one commits the report.
name: OROR NeoForge 1.21.1 patch build

on:
  push:
    branches: [claude/jolly-einstein-wvpjq1]
    paths: ['oror_rework/neoforge1211patch/**', '.github/workflows/oror1211.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oror1211-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: oror_rework/neoforge1211patch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Fetch the pack's mod jars
        run: |
          mkdir -p out
          python3 -I tools/cf_fetch.py pack/manifest-0.17.23.json pack/lock-0.17.23.json libs \
            epic-fight-21.17.3.1-mc1.21.1-neoforge.jar irons_spellbooks-1.21.1-3.16.3.jar irons_lib-1.21.1-2.2.0.jar \
            geckolib-neoforge-1.21.1-4.9.3.jar player-animation-lib-forge-2.0.4+1.21.1.jar curios-neoforge-9.5.1+1.21.1.jar \
            2>&1 | tee out/report.txt
      - name: Compile against NeoForge 1.21.1
        run: |
          gradle compileJava --console=plain 2>&1 | tee -a out/report.txt
      - name: Check mixin targets and mod ids in the real jars
        run: |
          {
            echo '== ComboAttacks.executeOnServer (Epic Fight)'
            javap -p -cp libs/epic-fight-21.17.3.1-mc1.21.1-neoforge.jar yesman.epicfight.skill.common.ComboAttacks | grep executeOnServer
            echo '== AbstractSpell.canBeCastedBy (Iron'"'"'s Spells)'
            javap -p -cp libs/irons_spellbooks-1.21.1-3.16.3.jar io.redspace.ironsspellbooks.api.spells.AbstractSpell | grep canBeCastedBy
            echo '== AdaptiveCombat.tick (OROR 0.17.23)'
            javap -p -cp base/oror_supreme_bosses-0.17.23.jar jp.oror.reborn.AdaptiveCombat | grep ' tick('
            echo '== Nightfall mod id'
            curl -sSfL -o "$RUNNER_TEMP/nightfall.jar" "$(python3 -I -c 'import json;print(json.load(open("pack/install-0.17.23.json"))["nightfall"]["url"])')"
            unzip -p "$RUNNER_TEMP/nightfall.jar" META-INF/neoforge.mods.toml | grep -m3 -E '^\s*modId'
          } 2>&1 | tee -a out/report.txt
      - name: Make the release jar
        run: |
          BASE=$(sed -n 's/^base_version=//p' gradle.properties); NEW=$(sed -n 's/^release_version=//p' gradle.properties)
          python3 -I tools/patch_jar.py base/oror_supreme_bosses-$BASE.jar build/classes/java/main lang \
            out/oror_supreme_bosses-$NEW.jar $BASE $NEW 2>&1 | tee -a out/report.txt
          sha256sum out/oror_supreme_bosses-$NEW.jar | tee -a out/report.txt
      - name: Commit the result
        if: always()
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f oror_rework/neoforge1211patch/out
          git commit -m "OROR 1.21.1 patch build ${GITHUB_SHA::7}: ${{ job.status }} [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
