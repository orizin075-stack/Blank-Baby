# One-off probe: how Superb Warfare 0.8.9.2 (the pack's version) drives its tanks and aircraft, so OROR's soldiers can
# crew and pilot them. Prints class lists, member signatures and selected decompiled methods to the job log only;
# nothing from the jar is committed.
name: Superb Warfare vehicle probe

on:
  push:
    branches: [claude/jolly-einstein-wvpjq1]
    paths: ['.github/workflows/sbw_vehicle_probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: oror_rework/neoforge1211patch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch Superb Warfare
        run: |
          python3 -I tools/cf_fetch.py pack/manifest-0.17.23.json pack/lock-0.17.23.json $RUNNER_TEMP/libs \
            superbwarfare-0.8.9.2-mc1.21.1-c22d98c2.jar
          curl -sSfL -o $RUNNER_TEMP/vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.10.1/vineflower-1.10.1.jar
          mkdir -p $RUNNER_TEMP/x && cd $RUNNER_TEMP/x && unzip -q $RUNNER_TEMP/libs/superbwarfare-0.8.9.2-mc1.21.1-c22d98c2.jar
      - name: Vehicle classes and entity ids
        run: |
          cd $RUNNER_TEMP/x
          echo "=== vehicle classes (bytes)"
          find com -path '*entity/vehicle*' -name '*.class' -printf '%s %p\n' | grep -v '\$' | sort -k2 | head -400
          echo "=== entity ids (ModEntities strings)"
          c=$(find com -name 'ModEntities.class' | head -1); echo $c
          javap -c -p -cp . $(echo ${c%.class} | tr / .) | grep -o 'String [a-z0-9_]*' | sort -u | tr '\n' ' '; echo
      - name: Base vehicle members
        run: |
          cd $RUNNER_TEMP/x
          for k in VehicleEntity MobileVehicleEntity ArmedVehicleEntity AutoAimableEntity GeoVehicleEntity ContainerMobileVehicleEntity \
                   LandArmorEntity AircraftEntity HelicopterEntity WeaponVehicleEntity TowerAI; do
            for c in $(find com -path '*vehicle*' -name "$k.class" | head -2); do
              echo "=================== $c"; javap -p -cp . $(echo ${c%.class} | tr / .) | head -400
            done
          done
          echo "=== who has input fields (forwardInputDown etc.)"
          grep -rl --include='*.class' -e 'forwardInputDown' -e 'ForwardInputDown' com | head -40
          echo "=== loiter"
          grep -rl --include='*.class' -i 'loiter' com | head -20
          echo "=== control / pilot"
          grep -rl --include='*.class' -e 'getControllingPassenger' com | grep -i vehicle | head -30
      - name: The whole vehicle tick, and who uses loiter and AI targets (decompiled)
        run: |
          cd $RUNNER_TEMP/x
          mkdir -p $RUNNER_TEMP/src
          dec() { rm -rf $RUNNER_TEMP/src/*; java -jar $RUNNER_TEMP/vf.jar "$1" $RUNNER_TEMP/src/ > /dev/null 2>&1; cat $RUNNER_TEMP/src/*.java $RUNNER_TEMP/src/*.kt 2>/dev/null | grep -v '^import'; }
          dec com/atsuishio/superbwarfare/entity/vehicle/base/VehicleEntity.class > $RUNNER_TEMP/ve.txt
          echo "=================== VehicleEntity.kt (whole)"; cat -n $RUNNER_TEMP/ve.txt | sed -n '1600,1700p;2860,3000p;3260,3830p;4100,4130p;4550,4670p'
          echo "=================== classes using LoiterActive / AiPassengerWeaponTarget / AiTurretTarget / MouseMoveSpeed"
          for k in getLoiterActive getAiPassengerWeaponTargetUUID getAiTurretTargetUUID setMouseMoveSpeedX MOUSE_SPEED_X; do
            echo "-- $k"; grep -rl --include='*.class' "$k" com | head -20
          done
          for c in $(grep -rl --include='*.class' getLoiterActive com | grep -v -E 'VehicleEntity.class|LoiterCommand' | head -4); do
            echo "=================== $c"; dec $c | head -700
          done
      - name: Vehicle definitions (engine types and seats)
        run: |
          cd $RUNNER_TEMP/x
          ls data/superbwarfare 2>/dev/null; find . -path '*vehicle*' -name '*.json' | head -60
          for v in m_1a_2 t_90a ztz_99a a_10a j_16 ah_6 tom_6 mi_28 hpj_11 bmp_2 lav_150 yx_100; do
            f=$(find . -path '*vehicle*' -name "$v.json" | head -1); echo "=== $v $f"; [ -n "$f" ] && python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(json.dumps(d)[:2500])" "$f"
          done
