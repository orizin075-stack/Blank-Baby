name: CPOG Lean Check

on:
  push:
    branches: ["cpog-lean-v45-check"]
  workflow_dispatch:

concurrency:
  group: cpog-lean-v45-check
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.0
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.34.0

      - name: Verify committed Lake manifest
        run: test -f lake-manifest.json

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Kernel build
        run: lake build

      - name: Independent Lean checker and axiom audit
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: "CPOG"
          axiom-audit: true
          axiom-audit-root: "CPOG"
