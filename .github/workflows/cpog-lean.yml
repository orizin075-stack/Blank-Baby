name: CPOG Proof Complete

on:
  push:
    branches: ["cpog-proof-complete-v01"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.0
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.34.0

      - name: Generate Lake manifest
        run: lake update

      - name: Kernel build
        run: lake build

      - name: Independent Lean checker
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: "CPOGLanguage CPOGOrigin CPOGMain CPOGTheory CPOGCheck"

      - name: Axiom audit CPOGLanguage
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false
          axiom-audit: true
          axiom-audit-root: "CPOGLanguage"

      - name: Axiom audit CPOGOrigin
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false
          axiom-audit: true
          axiom-audit-root: "CPOGOrigin"

      - name: Axiom audit CPOGMain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false
          axiom-audit: true
          axiom-audit-root: "CPOGMain"

      - name: Axiom audit CPOGTheory
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false
          axiom-audit: true
          axiom-audit-root: "CPOGTheory"

      - name: Axiom audit CPOGCheck
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false
          axiom-audit: true
          axiom-audit-root: "CPOGCheck"
