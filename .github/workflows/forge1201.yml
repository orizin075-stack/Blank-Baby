# Real Forge 1.20.1 build of the OROR Reborn port (oror_rework/forge1201), which needs the Forge and Mojang hosts.
# A successful build commits the reobfuscated jar to oror_rework/forge1201/out on the same branch.
name: OROR Forge 1.20.1 build

on:
  push:
    branches: [claude/jolly-einstein-wvpjq1]
    paths: ['oror_rework/forge1201/**', '.github/workflows/forge1201.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge1201-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Resources from the 0.17.18 jar
        run: |
          mkdir -p "$RUNNER_TEMP/oror/jar"
          unzip -q -j oror_rework/dist/OROR_War_Nightfall_v0.17.18_Import.zip 'overrides/mods/oror_supreme_bosses-0.17.18.jar' -d "$RUNNER_TEMP/oror"
          unzip -q "$RUNNER_TEMP/oror/oror_supreme_bosses-0.17.18.jar" -d "$RUNNER_TEMP/oror/jar"
          bash oror_rework/forge1201/prepare.sh "$RUNNER_TEMP/oror/jar"
      - name: Build
        working-directory: oror_rework/forge1201
        run: |
          set -o pipefail
          gradle build --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report the build errors
        if: failure()
        run: |
          # the job log is not readable from where the port is worked on: the errors go last and onto the branch
          mkdir -p oror_rework/forge1201/out
          grep -E 'error:|warning: \[|What went wrong|FAILURE|Could not' -A3 "$RUNNER_TEMP/build.log" | head -1500 > oror_rework/forge1201/out/build-errors.txt || true
          cp "$RUNNER_TEMP/build.log" oror_rework/forge1201/out/build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oror_rework/forge1201/out/build-errors.txt oror_rework/forge1201/out/build.log
          git commit -m "Forge 1.20.1 build log from CI build ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          tail -400 oror_rework/forge1201/out/build-errors.txt
      - name: Keep the jar
        run: |
          mkdir -p oror_rework/forge1201/out
          rm -f oror_rework/forge1201/out/*.jar
          cp oror_rework/forge1201/build/libs/oror_supreme_bosses-*.jar oror_rework/forge1201/out/
          ls -l oror_rework/forge1201/out
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q --ignore-unmatch oror_rework/forge1201/out/build-errors.txt oror_rework/forge1201/out/build.log
          git add oror_rework/forge1201/out
          git commit -m "Forge 1.20.1 jar from CI build ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
