# One-off probes for 0.17.25. What NightfallCraft 2.2.8.6's UI mods and GUI packs carry for the HUD and the GUI
# (vanilla GUI texture overrides, own GUI textures, built-in packs, HUD/screen mixins), next to the 1.21.1 builds the
# pack uses now. Names only; results go to oror_rework/nfc_ui/out/probe_ui.
name: NightfallCraft UI probe

on:
  push:
    branches: [claude/jolly-einstein-wvpjq1]
    paths: ['.github/workflows/nfc_probe.yml', 'oror_rework/nfc_ui/tools/probe_jars.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: NightfallCraft's UI files and the 1.21.1 ones
        run: |
          python3 -I oror_rework/nfc_ui/tools/probe_jars.py oror_rework/nfc_ui/out/probe_ui \
            1325071:8671039 1477275:9120893 352491:6956345 664719:7564643 1452633:9172461 1258522:7340950 \
            1307848:9015395 1377795:9076089 532127:4662781 1385997:7797342 1387898:8428466 1453870:7710887 \
            1274526:7706756 1304607:7867343 \
            1477275:9120920 664719:8605130 352491:8206075
      - name: Commit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f oror_rework/nfc_ui/out/probe_ui
          git commit -m "NightfallCraft UI probe ${GITHUB_SHA::7}: ${{ job.status }} [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
