# One-off probe for 0.17.25: how TCR Core 2.8.7 (NightfallCraft's core mod, 1.20.1) changes menus and widgets.
# Prints its title, world-select and create-world screen mixins (decompiled), its built-in pack registration and the sizes of its GUI images to
# the job log only; nothing from the jar is committed.
name: TCR Core GUI probe

on:
  push:
    branches: [claude/jolly-einstein-wvpjq1]
    paths: ['.github/workflows/nfc_probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Decompile TCR Core's GUI classes
        run: |
          T=$RUNNER_TEMP/t; mkdir -p $T/x $T/src; cd $T
          curl -sSfL -o tcr.jar https://mediafilez.forgecdn.net/files/8671/39/tcrcore-2.8.7.jar
          curl -sSfL -o vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.10.1/vineflower-1.10.1.jar
          unzip -q tcr.jar -d x
          python3 - <<'PY'
          import struct, glob
          for p in sorted(glob.glob('x/packs/*/assets/minecraft/textures/gui/*.png') + glob.glob('x/assets/tcrcore/textures/gui/**/*.png', recursive=True) + glob.glob('x/assets/tcrcore/textures/menu/*.png')):
              b = open(p, 'rb').read(24); w, h = struct.unpack('>II', b[16:24]); print(f'{w}x{h}  {p[2:]}')
          PY
          for f in x/packs/*/pack.mcmeta; do echo "== $f"; cat "$f"; echo; done
          find x/packs -maxdepth 3 | head -60
          find x/packs/tcr_assets x/packs/custom_models -type f | sed 's#^x/##' | head -80
          for n in TitleScreenMixin SelectWorldScreenMixin CreateWorldScreenMixin CreateWorldScreenMoreTabMixin WinScreenMixin; do
            for c in $(find x -name "$n.class"); do
              echo "== $c"; rm -rf src/*; java -jar vf.jar "$c" src/ > /dev/null 2>&1; cat src/*.java
            done
          done
          grep -rl --include=*.class -a "TitleScreen" x/com | head -20
