# Survey for making OROR War x Nightfall (1.21.1) look and play like NightfallCraft 2.2.8.6: which of NightfallCraft's
# mods, shaders and resource packs exist for NeoForge 1.21.1, and which config keys the pack's 1.21.1 Ares HUD and Epic
# Fight read. Results are committed to oror_rework/nfc_ui/out on this branch.
name: NightfallCraft UI survey

on:
  push:
    branches: [claude/jolly-einstein-wvpjq1]
    paths: ['oror_rework/nfc_ui/tools/survey.py', 'oror_rework/nfc_ui/nfc/nightfallcraft-2.2.8.6-mods.json', '.github/workflows/nfc_ui.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfc-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Availability of NightfallCraft's mods for 1.21.1
        run: |
          mkdir -p oror_rework/nfc_ui/out
          python3 -I oror_rework/nfc_ui/tools/survey.py oror_rework/nfc_ui/nfc/nightfallcraft-2.2.8.6-mods.json \
            oror_rework/nfc_ui/out/survey.json 2>&1 | tee oror_rework/nfc_ui/out/survey.txt
      - name: Config keys of the pack's 1.21.1 Ares HUD and Epic Fight
        run: |
          P=oror_rework/neoforge1211patch
          python3 -I $P/tools/cf_fetch.py $P/pack/manifest-0.17.23.json $P/pack/lock-0.17.23.json "$RUNNER_TEMP/jars" \
            ares_hud-2.1.0-neoforge-1.21.1.jar epic-fight-21.17.3.1-mc1.21.1-neoforge.jar CombatEvolution-2.3.2-NeoForge-1.21.1.jar
          for j in ares_hud-2.1.0-neoforge-1.21.1.jar epic-fight-21.17.3.1-mc1.21.1-neoforge.jar CombatEvolution-2.3.2-NeoForge-1.21.1.jar; do
            d="$RUNNER_TEMP/x_$j"; mkdir -p "$d"; unzip -q -o "$RUNNER_TEMP/jars/$j" -d "$d"
            { echo "== $j"; find "$d" -name '*.class' -path '*onfig*' -exec strings -n 3 {} \; | grep -E '^[a-zA-Z_][a-zA-Z0-9_]{2,60}$' | sort -u; } \
              > "oror_rework/nfc_ui/out/keys_${j%%.jar}.txt"
            find "$d" -iname '*.toml' -o -iname '*.json5' | head -20 >> "oror_rework/nfc_ui/out/keys_${j%%.jar}.txt"
          done
          wc -l oror_rework/nfc_ui/out/keys_*.txt
      - name: Commit the results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f oror_rework/nfc_ui/out
          git commit -m "NightfallCraft UI survey ${GITHUB_SHA::7}: ${{ job.status }} [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
