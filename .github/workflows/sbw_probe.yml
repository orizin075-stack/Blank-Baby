# One-off probe: how Superb Warfare 0.8.9.2 (the pack's version) defines its guns, so OROR can add its own.
# Prints item names, the gun classes and data files, and a few decompiled classes to the job log only; nothing from the
# jar is committed.
name: Superb Warfare gun probe

on:
  push:
    branches: [claude/jolly-einstein-wvpjq1]
    paths: ['.github/workflows/sbw_probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: oror_rework/neoforge1211patch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch Superb Warfare
        run: |
          python3 -I tools/cf_fetch.py pack/manifest-0.17.23.json pack/lock-0.17.23.json $RUNNER_TEMP/libs \
            superbwarfare-0.8.9.2-mc1.21.1-c22d98c2.jar
          curl -sSfL -o $RUNNER_TEMP/vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.10.1/vineflower-1.10.1.jar
          mkdir -p $RUNNER_TEMP/x && cd $RUNNER_TEMP/x && unzip -q $RUNNER_TEMP/libs/superbwarfare-0.8.9.2-mc1.21.1-c22d98c2.jar
      - name: Renderer builder, gun resources, the Taser's renderer and model
        run: |
          cd $RUNNER_TEMP/x
          mkdir -p $RUNNER_TEMP/src
          dec() { rm -rf $RUNNER_TEMP/src/*; java -jar $RUNNER_TEMP/vf.jar "$1" $RUNNER_TEMP/src/ > /dev/null 2>&1; cat $RUNNER_TEMP/src/*.java | grep -v '^import'; }
          for pat in 'GunRendererBuilder*.class' 'resource/gun/GunAnimation.class' 'resource/gun/ModelResource.class' 'CustomRendererItem.class' \
                     'renderer/gun/TaserItemRenderer.class' 'model/item/TaserItemModel.class' 'data/gun/ProjectileInfo.class' 'init/ModRarities.class'; do
            for c in $(find com -path "*$pat" | head -4); do echo "=================== $c"; dec "$c" | head -300; done
          done
      - name: GunItem shooting, GunData canShoot and charge
        run: |
          cd $RUNNER_TEMP/x
          mkdir -p $RUNNER_TEMP/src
          dec() { rm -rf $RUNNER_TEMP/src/*; java -jar $RUNNER_TEMP/vf.jar "$1" $RUNNER_TEMP/src/ > /dev/null 2>&1; cat $RUNNER_TEMP/src/*.java | grep -v '^import'; }
          echo "=================== GunItem (from getCustomHeadshot on)"
          dec com/atsuishio/superbwarfare/item/gun/GunItem.class | awk '/fun getCustomHeadshot/{on=1} on' | head -900
          echo "=================== GunData (selected functions)"
          dec com/atsuishio/superbwarfare/data/gun/GunData.class | awk '/fun (canShoot|charging|tick|hasEnoughAmmoToShoot|shouldStartReloading|currentAvailableShots|reloadAmmo)\(/{on=1; n=0} on{print; if (++n > 70) on=0}' | head -500
          echo "=== GunProp fields"
          javap -cp . -p com.atsuishio.superbwarfare.data.gun.GunProp | grep 'static final' | sed 's/.*Prop<[^ ]* //' | tr '\n' ' ' | head -c 6000; echo
          echo "=== who reads SHOOT_DELAY / charge"
          for c in $(grep -rl --include=*.class 'SHOOT_DELAY\|ShootDelay' com | head -6); do
            echo "--------- $c"; dec "$c" | grep -n -B6 -A16 'SHOOT_DELAY\|shootDelay\|charge\.' | head -120
          done
      - name: Arms and flare bones, the Taser's assets, tags, particles and damage
        run: |
          cd $RUNNER_TEMP/x
          mkdir -p $RUNNER_TEMP/src
          dec() { rm -rf $RUNNER_TEMP/src/*; java -jar $RUNNER_TEMP/vf.jar "$1" $RUNNER_TEMP/src/ > /dev/null 2>&1; cat $RUNNER_TEMP/src/*.java | grep -v '^import'; }
          c=$(find com -path '*AnimationHelper.class' | head -1); echo "=================== $c"
          dec "$c" | awk '/(renderArms|handleShootFlare|hideAllAttachments)\(/{on=1; n=0} on{print; if (++n > 90) on=0}' | head -400
          for f in assets/superbwarfare/sbw/guns/taser.json assets/superbwarfare/models/item/taser.json assets/superbwarfare/models/item/taser_base.json \
                   assets/superbwarfare/models/displaysettings/taser.item.json data/superbwarfare/tags/item/gun.json data/superbwarfare/tags/item/animated/pistol.json \
                   data/superbwarfare/tags/item/animated/sniper.json; do echo "=== $f"; cat "$f" 2>/dev/null | head -90; echo; done
          python3 - <<'PY'
          import json
          for g in ('taser', 'sentinel'):
              m = json.load(open(f'assets/superbwarfare/geo/{g}.geo.json', encoding='utf-8-sig'))
              geo = m['minecraft:geometry'][0]
              print('== geo', g, m.get('format_version'), geo['description'])
              for b in geo['bones']:
                  print('  bone', b['name'], 'parent', b.get('parent'), 'pivot', b.get('pivot'), 'rot', b.get('rotation'), 'cubes', len(b.get('cubes', [])))
              a = json.load(open(f'assets/superbwarfare/animations/{g}.animation.json', encoding='utf-8-sig'))
              for name, anim in a['animations'].items():
                  print('  anim', name, 'len', anim.get('animation_length'), 'loop', anim.get('loop'), 'bones', sorted(anim.get('bones', {}))[:14])
          a = json.load(open('assets/superbwarfare/animations/taser.animation.json', encoding='utf-8-sig'))
          for name in a['animations']:
              if 'idle' in name or 'fire' in name or 'shoot' in name:
                  print('== taser', name, json.dumps(a['animations'][name])[:1500])
          PY
          ls assets/superbwarfare/textures/item | grep -i 'taser\|sentinel'
          python3 -c "import struct;d=open('assets/superbwarfare/textures/item/taser.png','rb').read(24);print('taser.png', struct.unpack('>II', d[16:24]))"
          python3 -c "import struct;d=open('assets/superbwarfare/textures/gun_icon/taser_icon.png','rb').read(24);print('taser_icon.png', struct.unpack('>II', d[16:24]))"
          python3 -c "import struct;d=open('assets/superbwarfare/textures/item/taser_icon.png','rb').read(24);print('item/taser_icon.png', struct.unpack('>II', d[16:24]))" || true
          echo "=== ParticleTool and ModDamageTypes"
          javap -cp . -p com.atsuishio.superbwarfare.tools.ParticleTool | grep 'sendParticle' | head
          javap -cp . -p com.atsuishio.superbwarfare.init.ModDamageTypes | grep -i 'public static' | head -40
          echo "=== Taser bullet / energy item recipes"
          ls data/superbwarfare/recipe | grep -i 'taser\|battery\|cell\|annihilator\|charging' | head
          cat data/superbwarfare/recipe/cell.json 2>/dev/null; echo
          cat data/superbwarfare/recipe/charging_station.json 2>/dev/null; echo
          javap -cp . -p com.atsuishio.superbwarfare.block.entity.ChargingStationBlockEntity 2>/dev/null | grep -i 'static final\|CHARGE\|RATE' | head -20
