# One-off probe: how Superb Warfare 0.8.9.2 (the pack's version) defines its guns, so OROR can add its own.
# Prints item names, the gun classes and data files, and a few decompiled classes to the job log only; nothing from the
# jar is committed.
name: Superb Warfare gun probe

on:
  push:
    branches: [claude/jolly-einstein-wvpjq1]
    paths: ['.github/workflows/sbw_probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: oror_rework/neoforge1211patch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch Superb Warfare
        run: |
          python3 -I tools/cf_fetch.py pack/manifest-0.17.23.json pack/lock-0.17.23.json $RUNNER_TEMP/libs \
            superbwarfare-0.8.9.2-mc1.21.1-c22d98c2.jar
          curl -sSfL -o $RUNNER_TEMP/vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.10.1/vineflower-1.10.1.jar
          mkdir -p $RUNNER_TEMP/x && cd $RUNNER_TEMP/x && unzip -q $RUNNER_TEMP/libs/superbwarfare-0.8.9.2-mc1.21.1-c22d98c2.jar
      - name: Names, gun data and classes
        run: |
          cd $RUNNER_TEMP/x
          python3 - <<'PY'
          import json, os, re
          for lang in ('en_us', 'ja_jp', 'zh_cn'):
              p = f'assets/superbwarfare/lang/{lang}.json'
              if not os.path.exists(p): continue
              t = json.load(open(p, encoding='utf-8-sig'))
              hits = {k: v for k, v in t.items() if re.search(r'print|rail|laser|blue|charge|energy|blueprint', k + ' ' + v, re.I)}
              print('==', p, len(t), 'matching:', len(hits))
              for k, v in sorted(hits.items())[:120]: print(' ', k, '=', v)
          names = json.load(open('assets/superbwarfare/lang/en_us.json', encoding='utf-8-sig'))
          print('== items', sorted(k[len('item.superbwarfare.'):] + '=' + v for k, v in names.items() if k.startswith('item.superbwarfare.') and k.count('.') == 2))
          for root in ('data/superbwarfare',):
              for d, _, files in sorted(os.walk(root)):
                  if files: print('== dir', d, len(files), sorted(files)[:12])
          PY
          find com -path '*gun*' -name '*.class' | sed 's/\$.*//' | sort -u | head -150
      - name: Client gun resources, renderer base classes, capabilities, shooting hooks
        run: |
          cd $RUNNER_TEMP/x
          for f in assets/superbwarfare/sbw/guns/sentinel.json assets/superbwarfare/sbw/guns/secondary_cataclysm.json assets/superbwarfare/models/item/sentinel.json \
                   assets/superbwarfare/models/item/sentinel_icon.json assets/superbwarfare/models/item/sentinel_base.json assets/superbwarfare/models/displaysettings/sentinel.item.json; do
            echo "=== $f"; cat "$f" | head -80; echo; done
          ls assets/superbwarfare/geo | head -80
          ls assets/superbwarfare/textures/item | head -60
          ls assets/superbwarfare/textures/gun_icon | head -10
          python3 - <<'PY'
          import json
          t = json.load(open('assets/superbwarfare/lang/en_us.json', encoding='utf-8-sig'))
          print('== entities', sorted(k[len('entity.superbwarfare.'):] for k in t if k.startswith('entity.superbwarfare.')))
          s = json.load(open('assets/superbwarfare/sounds.json', encoding='utf-8-sig'))
          print('== sounds', len(s), sorted(k for k in s if any(w in k for w in ('charge', 'laser', 'energy', 'sentinel', 'cataclysm', 'railgun', 'annihilator', 'beam'))))
          PY
          mkdir -p $RUNNER_TEMP/src
          for pat in 'client/renderer/CustomGunRenderer.class' 'client/model/item/CustomGunModel.class' 'DefaultGunResource.class' 'resource/gun/GunResource.class' \
                     'init/ModCapabilities.class' 'item/gun/launcher/SecondaryCataclysmItem.class'; do
            for c in $(find com -path "*$pat" | head -2); do
              echo "=================== $c"; rm -rf $RUNNER_TEMP/src/*; java -jar $RUNNER_TEMP/vf.jar "$c" $RUNNER_TEMP/src/ > /dev/null 2>&1; cat $RUNNER_TEMP/src/*.java | grep -v '^import' | head -260
            done
          done
          echo "=== GunItem and GunData members"
          javap -cp . -p com.atsuishio.superbwarfare.item.gun.GunItem | head -120
          javap -cp . -p com.atsuishio.superbwarfare.data.gun.GunData | grep -i "charg\|canShoot\|shoot\|energy\|reload\|ammo" | head -60
          javap -cp . -p com.atsuishio.superbwarfare.data.gun.ShootParameters | head -40
          find com -name '*Laser*' -o -name '*Beam*' | head -20

      - name: Gun data files and assets of the Sentinel
        run: |
          cd $RUNNER_TEMP/x
          for f in data/superbwarfare/sbw/guns/gun.example.jsonc data/superbwarfare/sbw/guns/sentinel.json data/superbwarfare/sbw/guns/taser.json \
                   data/superbwarfare/sbw/guns/ntw_20.json data/superbwarfare/recipe/sentinel_smithing.json; do echo "=== $f"; cat "$f"; echo; done
          find assets/superbwarfare -iname '*sentinel*' | head -20
          ls assets/superbwarfare | head -30
          grep -rl "sbw/guns" --include=*.class com | head
      - name: Decompile energy, charge and ammo classes
        run: |
          cd $RUNNER_TEMP/x
          mkdir -p $RUNNER_TEMP/src
          for pat in 'item/gun/GunGeoItem.class' 'EnergyStorageItem.class' 'ammo_consumer_strategy/EnergyAmmoStrategy.class' \
                     'ammo_consumer_strategy/ItemAmmoStrategy.class' 'data/gun/AmmoConsumer.class' 'data/gun/subdata/Charge.class' \
                     'client/renderer/gun/SentinelItemRenderer.class' 'client/model/item/SentinelItemModel.class'; do
            for c in $(find com -path "*$pat" | head -2); do
              echo "=================== $c"; rm -rf $RUNNER_TEMP/src/*; java -jar $RUNNER_TEMP/vf.jar "$c" $RUNNER_TEMP/src/ > /dev/null 2>&1; cat $RUNNER_TEMP/src/*.java | grep -v '^import' | head -220
            done
          done
          echo "=== who registers item energy capabilities"
          grep -rl "EnergyStorage" --include=*.class com | head -20
          for c in $(grep -rl "registerItem" --include=*.class com | head -3); do
            echo "=================== $c"; rm -rf $RUNNER_TEMP/src/*; java -jar $RUNNER_TEMP/vf.jar "$c" $RUNNER_TEMP/src/ > /dev/null 2>&1; cat $RUNNER_TEMP/src/*.java | grep -v '^import' | grep -n -B3 -A12 "registerItem" | head -80
          done
          echo "=== data loader for guns"
          for c in $(grep -rl "sbw/guns" --include=*.class com | head -2); do
            echo "=================== $c"; rm -rf $RUNNER_TEMP/src/*; java -jar $RUNNER_TEMP/vf.jar "$c" $RUNNER_TEMP/src/ > /dev/null 2>&1; cat $RUNNER_TEMP/src/*.java | grep -v '^import' | grep -n -B4 -A20 "sbw/guns" | head -80
          done
