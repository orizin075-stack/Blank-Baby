# NightfallCraft 2.2.8.6 (Forge 1.20.1) itself, as the reference for OROR War x Nightfall's look: every file of its
# manifest from CurseForge, its config overrides, and the OROR Forge port, started in a real client whose title screen
# is photographed from the virtual display.
# Results go to oror_rework/nfc_ui/out/ref on this branch.
name: NightfallCraft reference screenshots

on:
  push:
    branches: [claude/jolly-einstein-wvpjq1]
    paths: ['.github/workflows/nfc_ref.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfc-ref-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      U: oror_rework/nfc_ui
      OUT: oror_rework/nfc_ui/out/ref
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Fetch NightfallCraft's files and overrides
        run: |
          rm -rf "$OUT"; mkdir -p "$OUT"; G=$RUNNER_TEMP/game; mkdir -p $G/mods $G/resourcepacks $G/shaderpacks
          python3 -I $U/tools/pack_tools.py nfcfetch $U/nfc/nightfallcraft-2.2.8.6-mods.json $G $OUT/files.json 2>&1 | tail -n 5
          cp oror_rework/forge1201/out/oror_supreme_bosses-0.17.18.jar $G/mods/
          # NightfallCraft 2.2.8.6's manifest does not load as published: fcp wants superbwarfare exactly 0.8.9 (0.8.9.2),
          # tcr_bosses wants indestructible 20.13+ (20.12.0 is the newest), find_me wants apricityui (absent). None of
          # them draws the HUD or the menus, so the reference run leaves them out.
          rm -f $G/mods/fcp-1.2.1.jar
          # TCR Core uses find_me's classes, and find_me needs ApricityUI, which the manifest lacks: add its newest
          # Forge 1.20.1 file (project found by slug through CFWidget).
          python3 -I - $G/mods <<'PY'
          import json, sys, urllib.parse, urllib.request
          H = {'User-Agent': 'Mozilla/5.0 (oror-nightfall-ci)', 'Accept': 'application/json'}
          def get(url):
              try:
                  return json.loads(urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=60).read())
              except Exception as error:
                  print('failed', url, error); return None
          pid = None
          for slug in ('apricityui', 'apricity-ui', 'apricity-ui-lib', 'apricityuilib'):
              pid = (get('https://api.cfwidget.com/minecraft/mc-mods/' + slug) or {}).get('id')
              if pid: print('apricityui project', slug, pid); break
          rows = []
          for page in range(4):
              data = get(f'https://www.curseforge.com/api/v1/mods/{pid}/files?pageIndex={page}&pageSize=50&sort=dateCreated&sortDescending=true') if pid else None
              rows += (data or {}).get('data') or []
          rows = [r for r in rows if '1.20.1' in r.get('gameVersions', []) and 'Forge' in r.get('gameVersions', [])]
          if rows:
              f = rows[0]; name = f['fileName']
              url = f"https://mediafilez.forgecdn.net/files/{f['id'] // 1000}/{f['id'] % 1000}/" + urllib.parse.quote(name)
              open(sys.argv[1] + '/' + name, 'wb').write(urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=300).read())
              print('fetched', name)
          else:
              print('no ApricityUI file found')
          PY
          # TCR Core needs tcr_bosses' classes, so tcr_bosses stays; for this local run only, its indestructible
          # requirement is relaxed to the newest file CurseForge still has (20.12.0). Nothing here is distributed.
          python3 -I - $G/mods/tcr_bosses-1.1.12-all.jar <<'PY'
          import re, shutil, sys, zipfile
          path = sys.argv[1]; tmp = path + '.tmp'
          with zipfile.ZipFile(path) as src, zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as dst:
              for info in src.infolist():
                  data = src.read(info)
                  if info.filename == 'META-INF/mods.toml':
                      text = data.decode('utf-8')
                      text, n = re.subn(r'(modId\s*=\s*"indestructible"[^\[]*?versionRange\s*=\s*")\[20\.13\.0,\)', r'\g<1>[20.12.0,)', text, flags=re.S)
                      print('indestructible range relaxed:', n)
                      data = text.encode('utf-8')
                  dst.writestr(info, data)
          shutil.move(tmp, path)
          PY
          # TCRMeshes (boss models) stops any game that is not the official modpack install; it draws no HUD or menu.
          rm -f $G/mods/tcrmeshes-1.0.0.jar
          # Sword Soaring 20.14.2.8 calls an Armourer's Workshop API class that 3.4.0-beta.3 no longer has; without
          # Armourer's Workshop (cosmetics, no HUD or menus) it skips that path.
          rm -f $G/mods/armourersworkshop-forge-1.20.1-3.4.0-beta.3.jar
          cp -r $U/nfc/config $G/config
          # NightfallCraft's own client pack from CurseForge (2.2.8.6): its overrides as published, including the
          # files TCR Core checks for (the repository copy leaves out NightfallCraft's logo images).
          python3 -I - $G "$RUNNER_TEMP/nfc_pack.zip" <<'PY'
          import io, json, sys, urllib.parse, urllib.request, zipfile
          H = {'User-Agent': 'Mozilla/5.0 (oror-nightfall-ci)', 'Accept': 'application/json'}
          def get(url):
              try:
                  return json.loads(urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=60).read())
              except Exception as error:
                  print('failed', url, error); return None
          pid = None
          for slug in ('nightfallcraft', 'nightfall-craft', 'nightfallcraft-the-casket-of-reveries', 'the-casket-of-reveries'):
              data = get('https://api.cfwidget.com/minecraft/modpacks/' + slug) or {}
              if data.get('id'): pid = data['id']; print('modpack', slug, pid, data.get('title')); break
          rows = []
          for page in range(6):
              data = get(f'https://www.curseforge.com/api/v1/mods/{pid}/files?pageIndex={page}&pageSize=50&sort=dateCreated&sortDescending=true') if pid else None
              rows += (data or {}).get('data') or []
          match = [r for r in rows if '2.2.8.6' in (r.get('displayName', '') + r.get('fileName', ''))]
          print('files', len(rows), 'matching 2.2.8.6:', [(r['id'], r['fileName']) for r in match][:5])
          if match:
              f = match[0]
              url = f"https://mediafilez.forgecdn.net/files/{f['id'] // 1000}/{f['id'] % 1000}/" + urllib.parse.quote(f['fileName'])
              data = urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=300).read()
              open(sys.argv[2], 'wb').write(data)
              z = zipfile.ZipFile(io.BytesIO(data)); n = 0
              for name in z.namelist():
                  if name.startswith('overrides/') and not name.endswith('/'):
                      target = sys.argv[1] + '/' + name[len('overrides/'):]
                      import os; os.makedirs(os.path.dirname(target), exist_ok=True)
                      open(target, 'wb').write(z.read(name)); n += 1
              print('official overrides copied:', n)
          PY
          ls $G/mods | wc -l; ls $G/resourcepacks $G/shaderpacks
      - name: Build the CI harness mod (Forge 1.20.1)
        working-directory: oror_rework/nfc_ui/harness1201
        run: |
          # It also carries the stand-in for the Apex Hosting class TCR Core's title screen refers to.
          gradle build --console=plain 2>&1 | tail -n 40
          cp build/libs/oror_harness_1201-1.0.0.jar $RUNNER_TEMP/game/mods/
      - name: Install the client and a virtual display
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri imagemagick rsync > /dev/null
          python3 -m venv $RUNNER_TEMP/venv && $RUNNER_TEMP/venv/bin/pip install -q portablemc==5.0.6
          G=$RUNNER_TEMP/game
          # NightfallCraft ships no options.txt; only Japanese (as for OROR) and the unattended-run settings are added.
          mkdir -p $G/config/defaultoptions
          printf 'lang:ja_jp\nonboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:6\nsimulationDistance:5\nskipMultiplayerWarning:true\njoinedFirstServer:true\ntutorialStep:none\nsoundCategory_master:0.0\n' >> $G/config/defaultoptions/options.txt
          cp -r $G/config $RUNNER_TEMP/config-input
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1600x900x24' glxinfo -B | tee $OUT/glxinfo.txt || true
      - name: Run the client
        timeout-minutes: 40
        run: |
          G=$RUNNER_TEMP/game
          export LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null
          # The harness mod never logged a screen in earlier runs, so the title screen is photographed from the virtual
          # display itself once FancyMenu has set it up, then the client is stopped.
          Xvfb :99 -screen 0 1600x900x24 > /dev/null 2>&1 &
          export DISPLAY=:99; sleep 3
          mkdir -p $G/screenshots
          ( while sleep 10; do
              if ls $G/crash-reports/*.txt > /dev/null 2>&1; then sleep 20; pkill -f forgeclient || pkill java; break; fi
              if grep -q 'ScreenCustomizationLayer registered: title_screen' $G/logs/latest.log 2>/dev/null; then
                for t in 30 60 120; do
                  sleep $((t == 30 ? 30 : t == 60 ? 30 : 60)); import -window root png:$G/screenshots/ref_title_${t}s.png && echo "title shot ${t}s"
                done
                pkill -f forgeclient || pkill java; break
              fi
            done ) &
          timeout 35m $RUNNER_TEMP/venv/bin/portablemc start forge::1.20.1-47.4.28 \
            --main-dir $RUNNER_TEMP/mc --mc-dir $G -u OrorTester --resolution 1600x900 --jvm "$JAVA_HOME/bin/java" \
            --jvm-arg=-Xmx8G,-Xms2G > $RUNNER_TEMP/client.out 2>&1 || echo "client exit code $?" | tee $OUT/client-exit.txt
          tail -n 60 $RUNNER_TEMP/client.out
          ls -la $G/screenshots
      - name: Collect screenshots, logs and written configs
        if: always()
        run: |
          G=$RUNNER_TEMP/game; C=$OUT/client; mkdir -p $C
          tail -n 300 $RUNNER_TEMP/client.out > $C/stdout-tail.txt 2>/dev/null || true
          for f in $G/screenshots/*.png; do [ -f "$f" ] && convert "$f" -resize '1280x>' -quality 82 "$C/$(basename "${f%.png}").jpg"; done
          cp $G/harness/* $C/ 2>/dev/null || true
          mkdir -p $C/crash-reports; cp $G/crash-reports/* $C/crash-reports/ 2>/dev/null || true
          L=$G/logs/latest.log
          if [ -f $L ]; then
            grep -n -E '\[harness\]|ERROR|FATAL|Exception|Caused by|Mixin apply failed|InvalidInjection' $L | cut -c1-600 | head -n 4000 > $C/latest-filtered.log
            gzip -c $L > $C/latest.log.gz; [ $(stat -c %s $C/latest.log.gz) -lt 8000000 ] || rm $C/latest.log.gz
          fi
          cp $G/options.txt $C/options.txt 2>/dev/null || true
          [ -d $RUNNER_TEMP/config-input ] && rsync -a --checksum --compare-dest=$RUNNER_TEMP/config-input/ $G/config/ $C/config-after/ \
            && find $C/config-after -type d -empty -delete || true
          ls -la $C
      - name: Commit the results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git commit -m "NightfallCraft reference screenshots ${GITHUB_SHA::7}: ${{ job.status }} [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
