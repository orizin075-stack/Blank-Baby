name: CPOG ProofComplete v50

on:
  push:
    branches: ["cpog-proofcomplete-v50"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and verify proof package
        shell: bash
        run: |
          cat chunks/chunk00 chunks/chunk01 chunks/chunk02a chunks/chunk02b chunks/chunk03a chunks/chunk03b > package.b64
          echo "cab16e0e8b8a897dc5840a0c259ea70b56428d6e22b39d8b65f2b95f5bb29953  package.b64" | sha256sum -c -
          base64 -d package.b64 > CPOG_ProofComplete_v50.tar.gz
          echo "52f3b940e74635948d1cbb40ac6ad3c5349da5ea8bb0ee2e85a307550af2fa00  CPOG_ProofComplete_v50.tar.gz" | sha256sum -c -
          tar -xzf CPOG_ProofComplete_v50.tar.gz
          cp fixes/History.lean CPOG_ProofComplete_v50/CPOG/History.lean
          sed -i 's/exact hc (Option.some.inj hSome)/exact hc (Option.some.inj hSome).symm/' CPOG_ProofComplete_v50/CPOG/General.lean
          python3 fixes/apply_round2.py
          cp fixes/Origin.lean CPOG_ProofComplete_v50/CPOG/Origin.lean
          python3 fixes/apply_round3.py
          python3 fixes/apply_round4_language.py
          cp fixes/Policy.lean CPOG_ProofComplete_v50/CPOG/Policy.lean
          cp fixes/FiniteConvergence.lean CPOG_ProofComplete_v50/CPOG/FiniteConvergence.lean

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.0
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.34.0

      - name: Cache Mathlib packages
        uses: actions/cache@v4
        with:
          path: CPOG_ProofComplete_v50/.lake/packages
          key: cpog-mathlib-v4.34.0

      - name: Resolve dependencies
        working-directory: CPOG_ProofComplete_v50
        run: lake update

      - name: Build all proof modules
        working-directory: CPOG_ProofComplete_v50
        run: lake build

      - name: Kernel re-check and axiom audit
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: CPOG_ProofComplete_v50
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: "CPOG"
          axiom-audit: true
          axiom-audit-root: "CPOG"
