// The OROR Reborn classes rebuilt for a NeoForge 1.21.1 release (see README.md): compiled against the real NeoForge and
// the pack's own mod jars (libs/, fetched by tools/cf_fetch.py), then merged into the shipped jar by tools/patch_jar.py.
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neoforge_version
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: '*.jar')
    compileOnly files("base/oror_supreme_bosses-${base_version}.jar")
    // (r71) the user's Duel Dominion, for the mixins into it (DuelTalismanShowMixin, DuelRetributionMixin); never bundled
    compileOnly files('user_mods/dueldominion-0.17.0-alpha.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '2000']
}
