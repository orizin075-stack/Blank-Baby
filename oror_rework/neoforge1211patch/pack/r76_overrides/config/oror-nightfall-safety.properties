# OROR Nightfall r5 - building preservation and overload protection
# Changes are read once on launch. Restart Minecraft after editing.
# WARNING: enabling either of the two unsafe switches can overwrite buildings,
# overwrite storage, and cause long server stalls. Always back up your world.
allowCitadelAutoUpdateAndRebuild=false
allowRoyalTerrainClearing=false
# Also prevents player TNT from breaking blocks; blast damage to entities remains.
protectExplosionBlocks=true
