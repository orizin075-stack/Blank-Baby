# 項目名：Server Cheat Permissions
# 説明：Choose who can use JEI cheat mode on this server.
[permissions]
	# 項目名：Allow Cheat Mode for Operators
	# 説明：Allow players with operator status (/op) to use JEI cheat mode.
	# 有効値：[true, false]
	# デフォルト値：true
	enableCheatModeForOp = true

	# 項目名：Allow Cheat Mode in Creative Mode
	# 説明：Allow players in Creative Mode to use JEI cheat mode.
	# 有効値：[true, false]
	# デフォルト値：true
	enableCheatModeForCreative = true

	# 項目名：Allow Cheat Mode with Give Permission
	# 説明：Allow players who can use the /give command to use JEI cheat mode.
	# 有効値：[true, false]
	# デフォルト値：false
	enableCheatModeForGive = false


